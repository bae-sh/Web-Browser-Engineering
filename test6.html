<!doctype html>
<html>

<head>
  <link rel="stylesheet" href="test6.css">
</head>

<body>
  <h1>6장 스타일 테스트</h1>
  <div style="background-color:lightblue">style 속성으로 넣은 하늘색 배경입니다.</div>
  <p>이 문단은 <b>굵게</b>와 <i>기울임</i>이 browser.css 규칙으로 적용됩니다.
    <small>작은 글씨</small>와 <big>큰 글씨</big>도 font-size 퍼센트로 처리됩니다.</p>
  <div>
    <p>이 문단은 <code>div p</code> 후손 셀렉터에 걸려 초록색이어야 합니다.</p>
  </div>
  <p style="color:purple">style 속성이 스타일 시트를 덮어써서 보라색입니다.</p>
  <pre>pre { background-color: lightyellow }
    공백과    들여쓰기가 유지되고 고정폭입니다.</pre>
  <p>링크 색 테스트: <a href="http://example.org">이 텍스트는 파란색</a>입니다.</p>
</body>

</html>
